<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar - Litros360</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .login-card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 340px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            color: #1e293b;
        }

        label {
            display: block;
            margin: 15px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 22px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .error {
            color: #dc2626;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h1>Litros360</h1>
        <p style="text-align:center;">Ingresá a tu cuenta</p>

        {% if form.errors %}
            <p class="error">
                Usuario o contraseña incorrectos.
            </p>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <label for="id_username">Usuario</label>
            {{ form.username }}

            <label for="id_password">Contraseña</label>
            {{ form.password }}

            <button type="submit">Ingresar</button>
        </form>
    </div>

</body>
</html>
